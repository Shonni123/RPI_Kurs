<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 380" width="100%" height="100%" style="background:#ffffff; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1E3A8A" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748B" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#D97706" />
    </marker>
    <filter id="shadow" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- ================= 1. БАЗА ДАННЫХ (DATABASE) ================= -->
  <rect x="25" y="75" width="180" height="230" rx="6" fill="#FAFBFD" stroke="#94A3B8" stroke-width="1.2" />
  <text x="115" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">База данных (Database)</text>

  <!-- Цилиндр СУБД SQLite 3 -->
  <g transform="translate(50, 150)">
    <path d="M 0 25 C 0 10, 130 10, 130 25 L 130 75 C 130 90, 0 90, 0 75 Z" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4" />
    <path d="M 0 50 C 0 65, 130 65, 130 50" fill="none" stroke="#94A3B8" stroke-width="1.2" />
    <ellipse cx="65" cy="25" rx="65" ry="15" fill="#E2E8F0" stroke="#64748B" stroke-width="1.4" />
    <text x="65" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#1E293B">СУБД SQLite 3</text>
  </g>

  <!-- ================= 2. СЕРВЕРНАЯ ЧАСТЬ (BACKEND) ================= -->
  <rect x="245" y="75" width="465" height="230" rx="6" fill="#FAFBFD" stroke="#94A3B8" stroke-width="1.2" />
  <text x="477" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Серверная часть (Backend)</text>

  <!-- Блок: Контроллеры -->
  <rect x="265" y="165" width="215" height="60" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4" filter="url(#shadow)" />
  <text x="372" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Контроллеры</text>
  <text x="372" y="211" text-anchor="middle" font-size="11.5" fill="#475569">(Flights, Airports, Auth)</text>

  <!-- Блок: REST API Маршрутизатор -->
  <rect x="520" y="165" width="170" height="60" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4" filter="url(#shadow)" />
  <text x="605" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">REST API</text>
  <text x="605" y="211" text-anchor="middle" font-size="12" fill="#475569">Маршрутизатор</text>

  <!-- ================= 3. КЛИЕНТСКАЯ ЧАСТЬ (FRONTEND) ================= -->
  <rect x="750" y="75" width="845" height="230" rx="6" fill="#FAFBFD" stroke="#94A3B8" stroke-width="1.2" />
  <text x="1172" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Клиентская часть (Frontend)</text>

  <!-- Блок: Службы данных (Services) -->
  <rect x="775" y="165" width="155" height="60" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4" filter="url(#shadow)" />
  <text x="852" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Службы данных</text>
  <text x="852" y="211" text-anchor="middle" font-size="11.5" fill="#475569">(Services / api.ts)</text>

  <!-- Блок: Локальный кэш (Fallback) -->
  <rect x="990" y="165" width="145" height="60" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="4 3" filter="url(#shadow)" />
  <text x="1062" y="192" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400E">Локальный кэш</text>
  <text x="1062" y="211" text-anchor="middle" font-size="11" fill="#B45309">(Fallback / Mocks)</text>

  <!-- Блок: Интерфейс React SPA -->
  <rect x="1195" y="165" width="160" height="60" rx="5" fill="#FFFFFF" stroke="#64748B" stroke-width="1.4" filter="url(#shadow)" />
  <text x="1275" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#0F172A">Интерфейс</text>
  <text x="1275" y="211" text-anchor="middle" font-size="12" fill="#475569">React SPA</text>

  <!-- Блок: Пользователь -->
  <rect x="1425" y="165" width="145" height="60" rx="5" fill="#F1F5F9" stroke="#64748B" stroke-width="1.4" filter="url(#shadow)" />
  <text x="1497" y="201" text-anchor="middle" font-size="14" font-weight="bold" fill="#0F172A">Пользователь</text>

  <!-- ================= СТРЕЛКИ И СВЯЗИ ================= -->

  <!-- 1. Действие в интерфейсе (Пользователь -> Интерфейс) [Нижняя дуга] -->
  <path d="M 1425 210 C 1395 240, 1375 240, 1355 215" fill="none" stroke="#1E3A8A" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="1390" y="255" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A8A">1. Действие в интерфейсе</text>

  <!-- 2. Вызов метода (Интерфейс -> Службы данных) [Нижняя дуга] -->
  <path d="M 1205 215 C 1115 285, 1025 285, 930 215" fill="none" stroke="#1E3A8A" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="1067" y="295" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1E3A8A">2. Вызов метода</text>

  <!-- Пунктирный Fallback контур -->
  <!-- Службы -> Кэш -->
  <path d="M 930 195 L 988 195" fill="none" stroke="#D97706" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow-amber)" />
  <text x="960" y="182" text-anchor="middle" font-size="10" font-weight="500" fill="#B45309">Сбой сети / &gt;2c</text>

  <!-- Кэш -> Интерфейс -->
  <path d="M 1135 195 L 1193 195" fill="none" stroke="#D97706" stroke-width="1.3" stroke-dasharray="3 3" marker-end="url(#arrow-amber)" />
  <text x="1165" y="182" text-anchor="middle" font-size="10" font-weight="500" fill="#B45309">Автономные данные</text>

  <!-- 3. HTTP Запрос (Службы данных -> REST API Маршрутизатор) [Нижняя дуга] -->
  <path d="M 780 215 C 745 250, 715 250, 680 215" fill="none" stroke="#1E3A8A" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="730" y="260" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A8A">3. HTTP Запрос</text>

  <!-- 4. Вызов контроллера (Маршрутизатор -> Контроллеры) [Нижняя дуга] -->
  <path d="M 525 210 C 510 225, 495 225, 480 210" fill="none" stroke="#1E3A8A" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="502" y="238" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1E3A8A">4. Вызов контроллера</text>

  <!-- 5. SQL Запрос (Контроллеры -> СУБД SQLite 3) [Нижняя дуга] -->
  <path d="M 270 215 C 230 260, 205 260, 165 225" fill="none" stroke="#1E3A8A" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="218" y="265" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A8A">5. SQL Запрос</text>

  <!-- ================= ОБРАТНЫЙ ПОТОК (ВЕРХНИЙ КОНТУР) ================= -->

  <!-- 6. Строки данных (СУБД -> Контроллеры) [Верхняя дуга] -->
  <path d="M 165 175 C 205 140, 230 140, 268 175" fill="none" stroke="#1E3A8A" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="217" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A8A">6. Строки данных</text>

  <!-- 7. JSON Ответ (Контроллеры -> Маршрутизатор) [Верхняя дуга] -->
  <path d="M 480 175 C 495 160, 510 160, 523 175" fill="none" stroke="#1E3A8A" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="502" y="150" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1E3A8A">7. JSON Ответ</text>

  <!-- 8. HTTP 200/201 (Маршрутизатор -> Службы данных) [Верхняя дуга] -->
  <path d="M 680 175 C 715 140, 745 140, 778 175" fill="none" stroke="#1E3A8A" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="730" y="135" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A8A">8. HTTP 200/201</text>

  <!-- 9. Обновление состояния (Службы данных -> Интерфейс) [Верхняя дуга] -->
  <path d="M 930 175 C 1025 105, 1115 105, 1202 175" fill="none" stroke="#1E3A8A" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="1067" y="98" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1E3A8A">9. Обновление состояния</text>

  <!-- 10. Рендеринг (Интерфейс -> Пользователь) [Верхняя дуга] -->
  <path d="M 1355 175 C 1375 150, 1395 150, 1423 175" fill="none" stroke="#1E3A8A" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <text x="1390" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A8A">10. Рендеринг</text>
</svg>
